<title>Adada &amp; Kabbani · Images for the company profile</title>
<style>
/* Adada & Kabbani project image approval. Frosted-glass panels over a blurred

:root {

  --mute: #6a6461;

  --font: Optima, "Optima Nova", Candara, "Segoe UI", "Gill Sans", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: #e6ded3; }
body {
  margin: 0;
  min-height: 100dvh;
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: #e6ded3 url(bg-land.jpg) center / cover no-repeat;
}
@media (max-aspect-ratio: 1/1) { body::before { background-image: url(bg-port.jpg); } }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--oxblood); outline-offset: 2px; }
[hidden] { display: none !important; }

.glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--glass-shadow); }
.logo { display: block; height: 30px; width: auto; }
.title { margin: 0; font-size: clamp(30px, 5vw, 40px); font-weight: 400; line-height: 1.1; color: var(--ink-deep); text-wrap: balance; }
.lede { margin: 0; font-size: 15.5px; color: var(--mute); max-width: 66ch; }
.error { margin: 0; color: var(--oxblood); font-size: 14.5px; }

/* buttons */
.primary, .submit {
  border: 0; border-radius: 999px; background: var(--oxblood); color: #fff; cursor: pointer;
  letter-spacing: 0.18em; text-transform: uppercase;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 8px 20px rgba(146, 33, 51, 0.28);
}
.primary { height: 54px; padding: 0 28px; font-size: 14px; }
.primary:disabled, .submit:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
.ghost, .all {
  border-radius: 999px; border: 1px solid rgba(73, 65, 62, 0.28); background: rgba(255, 255, 255, 0.5);
  color: var(--ink-deep); cursor: pointer; text-transform: uppercase; white-space: nowrap;
}
.ghost { height: 50px; padding: 0 26px; font-size: 13px; letter-spacing: 0.16em; }
.all { height: 42px; padding: 0 20px; font-size: 12px; letter-spacing: 0.16em; }

.center { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
.card { width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: flex-start; padding: 40px; border-radius: 28px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 24px 64px rgba(43, 37, 35, 0.14); }
.card .logo { height: 34px; }
.card .title { margin-top: 28px; font-size: clamp(30px, 6vw, 36px); }
.card .lede { margin-top: 10px; font-size: 16px; }
.gate { align-self: stretch; display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.label { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
.input {
  height: 54px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(73, 65, 62, 0.24);

}
.input:focus { border-color: var(--oxblood); }
.gate .primary { margin-top: 8px; }
.done-mark {

}
.card .ghost { margin-top: 28px; }
a.ghost { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }

.tile[data-on="true"] { box-shadow: 0 0 0 2px var(--ok), var(--glass-shadow); }

.next-forms { align-self: stretch; margin-top: 26px; padding-top: 18px; border-top: 1px solid rgba(73, 65, 62, 0.18); display: flex; flex-direction: column; gap: 10px; }
.next-forms a { color: var(--ink-deep); font-size: 16px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(73, 65, 62, 0.35); }
.next-forms a:hover { color: var(--oxblood); text-decoration-color: currentColor; }
.pic {
  position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0;
  border-radius: 13px; overflow: hidden; background: rgba(255, 255, 255, 0.3); cursor: zoom-in;
}
div.pic { cursor: default; }
.pic img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; }
.num {

  font-size: 12px; letter-spacing: 0.06em; color: var(--ink-deep); font-variant-numeric: tabular-nums;
}
.tick {
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 999px; background: var(--ok);
  color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(46, 106, 75, 0.35);
}
.tick svg { width: 13px; height: 13px; }
.approve {
  height: 44px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(255, 255, 255, 0.5);

/* bottom bar */
.bar {

/* What this person already sent from the other two forms: notes on this device, merged with the online store when there is one. */
const SENT_KEY = (u) => `ak-sent:${NS}:${u}:${USER}`;
let OTHER = {};   // use -> Set of image numbers approved and sent from that form
let REMOTE = {};  // use -> { n, at } read from the online store
function readLocal(u) {
  try { const d = JSON.parse(store.get(SENT_KEY(u)) || "null"); return d && Array.isArray(d.n) && typeof d.at === "number" ? d : null; } catch { return null; }
}
function loadOthers() {
  OTHER = {};
  for (const u of Object.keys(USES)) {
    if (u === CFG.use) continue;
    const a = readLocal(u), b = REMOTE[u];
    const best = !a ? b : !b ? a : (a.at >= b.at ? a : b);   // the most recent send wins
    if (best && best.n.length) OTHER[u] = new Set(best.n);
  }
}
function adoptLegacy() {
  // Picks and sent notes saved on this device before sign-in existed go to the first person who signs in here.
  // Old sent notes stay on this device only (never copied to the online store).
  const moves = [["ak-sel:" + NS + ":" + CFG.use, selKey(), false]];
  for (const u of Object.keys(USES)) moves.push(["ak-sent:" + NS + ":" + u, SENT_KEY(u), true]);
  for (const [from, to, sent] of moves) {
    const v = store.get(from);
    if (v == null) continue;
    if (store.get(to) == null) {
      let keep = v;
      if (sent) { try { const d = JSON.parse(v); d.dev = 1; keep = JSON.stringify(d); } catch { keep = null; } }
      if (keep != null) store.set(to, keep);
    }
    store.remove(from);
  }
}
const othersFor = (n) => Object.keys(OTHER).filter((u) => OTHER[u].has(n));
function rememberSent(picked) {
  const rec = { n: picked.map((i) => i.n), at: Date.now() };
  store.set(SENT_KEY(CFG.use), JSON.stringify(rec));
  saveRemote(CFG.use, rec).then((ok) => { window.__akStore = ok; });
}

/* ---------- online store (Firebase Realtime Database, REST): /ak/u/<hash of the username>/<form> = { iv, ct },
   each entry encrypted with the password key, so the store only ever holds sealed notes ---------- */
const STORE_MS = 9000;
const b64e = (u8) => btoa(String.fromCharCode(...u8));
let uhCache = null;
async function userHash() {
  if (uhCache && uhCache.u === USER) return uhCache.h;
  const d = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("user:" + USER)));
  uhCache = { u: USER, h: [...d.slice(0, 8)].map((x) => x.toString(16).padStart(2, "0")).join("") };
  return uhCache.h;
}
async function sealRec(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, new TextEncoder().encode(JSON.stringify(obj))));
  return { iv: b64e(iv), ct: b64e(ct) };
}
async function unsealRec(rec) {
  const d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(rec.iv) }, KEY, b64(rec.ct))));
  return d && Array.isArray(d.n) && typeof d.at === "number" ? { n: d.n, at: d.at } : null;
}
async function timedFetch(url, opts, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { ...opts, signal: ctl.signal }); } finally { clearTimeout(t); }
}
const storeUrl = (path) => String(MAN.store).replace(/\/+$/, "") + path + ".json";
async function storeGet(path) {   // null when nothing is there yet
  const r = await timedFetch(storeUrl(path), { cache: "no-store" }, STORE_MS);
  if (!r.ok) throw new Error("store " + r.status);
  return r.json();
}
async function storePut(path, body) {
  const r = await timedFetch(storeUrl(path) + "?print=silent", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }, STORE_MS);
  if (!r.ok) throw new Error("store " + r.status);
}
async function loadRemote() {
  if (!MAN || !MAN.store) return false;
  try {
    const mine = await storeGet(`/ak/u/${await userHash()}`);
    const next = {};
    if (mine && typeof mine === "object") {
      for (const [u, rec] of Object.entries(mine)) {
        if (!USES[u] || !rec || typeof rec !== "object") continue;
        try { const d = await unsealRec(rec); if (d) next[u] = d; } catch { /* not ours: skip */ }
      }
    }
    REMOTE = next;
    return true;
  } catch { return false; }   // offline or the store is down: the device notes still work
}
let storeQueue = Promise.resolve();
function saveRemote(use, rec) {   // queued, so two saves from this page never overlap
  const job = storeQueue.then(async () => {
    if (!MAN || !MAN.store) return false;
    const path = `/ak/u/${await userHash()}/${use}`;
    for (let attempt = 0; attempt < 2; attempt += 1) {
      try {
        const cur = await storeGet(path);        // never write blind: a failed read stops this attempt
        if (cur && typeof cur === "object") {    // a newer send from another device stays
          try { const d = await unsealRec(cur); if (d && d.at >= rec.at) { REMOTE[use] = d; return true; } } catch { /* replace it */ }
        }
        await storePut(path, await sealRec(rec));
        REMOTE[use] = rec;
        return true;
      } catch { /* try once more */ }
    }
    return false;
  });
  storeQueue = job.catch(() => false);
  return job;
}
async function syncUp() {   // a send this device made while the store was out of reach goes up now
  for (const u of Object.keys(USES)) {
    const a = readLocal(u), b = REMOTE[u];
    if (a && !a.dev && (!b || a.at > b.at)) await saveRemote(u, a);
  }
}
let lastRemote = 0;
async function refreshFromRemote() {
  if (MAN && MAN.store) {
    lastRemote = Date.now();
    if (await loadRemote()) syncUp();
  }
  loadOthers();
  if (tiles.size) refreshMarks();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && KEY && tiles.size && Date.now() - lastRemote > 15000) refreshFromRemote();
});
function signOut() {
  store.remove(LOGIN_KEY);
  location.replace(location.pathname + location.search);
}
const CHECK_S = CHECK.replace('width="16" height="16"', 'width="11" height="11"');
function markEls(n) {
  return othersFor(n).map((u) => h("span", { class: "mark", style: `background:${USES[u].colour}` },
    h("span", { class: "mi", html: CHECK_S }), h("span", { class: "pre" }, "Approved for "), h("span", { class: "w" }, USES[u].short)));
}
function applyMarks(t, n) {
  const others = othersFor(n);
  t.marks.replaceChildren(...markEls(n));
  t.marks.hidden = !others.length;
  if (others.length) {
    t.li.dataset.other = String(Math.min(others.length, 2));
    t.li.style.setProperty("--ring1", USES[others[0]].colour);
    if (others[1]) t.li.style.setProperty("--ring2", USES[others[1]].colour);
  } else delete t.li.dataset.other;
  const img = MAN.images[n - 1];
  t.picBtn.setAttribute("aria-label", `View image ${pad2(img.k)}, ${secOf(img).name}, larger` + (others.length ? `. Approved for ${others.map((u) => USES[u].short).join(" and ")}.` : ""));
}
function legendKids() {
  const used = Object.keys(OTHER);
  if (!used.length) return [];
  return ["Outlined images were already approved in your other forms:",
    ...used.map((u) => h("span", {}, h("i", { style: `background:${USES[u].colour}` }), `${USES[u].label} (${OTHER[u].size})`))];
}
let legendEl = null;
function refreshMarks() {
  for (const [n, t] of tiles) applyMarks(t, n);
  if (legendEl) { legendEl.replaceChildren(...legendKids()); legendEl.hidden = !Object.keys(OTHER).length; }
  if (viewerState) paintViewer();

/* ---------- crypto ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(CFG.salt), iterations: CFG.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function fetchBytes(name) {
  const r = await fetch((CFG.data || "d/") + name + ".bin?v=" + (name === "m" && CFG.mv ? CFG.mv : CFG.v));
  if (!r.ok) throw new Error("network");
  return new Uint8Array(await r.arrayBuffer());
}
async function decrypt(buf, key) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12)));
}
const openFile = async (name) => decrypt(await fetchBytes(name), KEY);

function thumb(n) {
  if (!thumbs.has(n)) {
    const p = openFile("t" + n).then((bytes) => ({ bytes, url: URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" })) }));
    p.catch(() => thumbs.delete(n));
    thumbs.set(n, p);
  }
  return thumbs.get(n);
}
function full(n) {
  if (!fulls.has(n)) {
    const p = openFile("f" + n).then((bytes) => URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" })));
    p.catch(() => fulls.delete(n));
    fulls.set(n, p);
  }
  return fulls.get(n);
}

/* ---------- gate ---------- */
async function unlock(user, pass) {
  const u = String(user || "").trim().toLowerCase();
  const key = await deriveKey(pass);
  const sealed = await fetchBytes("m");        // throws "network" if offline
  let plain;
  try { plain = await decrypt(sealed, key); } catch { throw new Error("wrong"); }
  const man = JSON.parse(new TextDecoder().decode(plain));
  if (!u || !Array.isArray(man.users) || !man.users.includes(u)) throw new Error("wrong");
  KEY = key; USER = u; MAN = man;
  MAN.sections.forEach((sec, i) => { sec.index = i; sec.items = []; });
  MAN.images.forEach((img, i) => { img.i = i; MAN.sections[img.s].items.push(img); });
  store.set(LOGIN_KEY, JSON.stringify({ u, p: pass.trim().toLowerCase() }));
}

}

function showGate(message) {
  const userIn = h("input", { id: "user", class: "input", name: "username", autocomplete: "username", autocapitalize: "none", autocorrect: "off", spellcheck: "false", "aria-describedby": "code-error" });

  const button = h("button", { class: "primary", type: "submit" }, "Continue");

      await unlock(userIn.value, input.value);

     h("label", { class: "label", for: "code", style: "margin-top:10px" }, "Password"), input, error, button);
  app.replaceChildren(card(
    h("h1", { class: "title" }, location.hash.startsWith("#r-") ? "Approved images" : USE.title),
    h("p", { class: "lede" }, "Sign in to view the images."), form));
}

/* ---------- selection ---------- */
const approved = () => MAN.images.filter((i) => SEL.has(i.n));
function saveSel() { store.set(selKey(), JSON.stringify([...SEL])); }

let barCount, barHint, barSubmit, barError, tiles = new Map(), secUI = [], viewerState = null;
const SEND_MS = 20000;   // attachment request: base time limit, plus 10 s per MB of PDF
const LINKS_MS = 12000;  // links-only request (8 s when the attachment request already timed out)
const io = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    io.unobserve(entry.target);
    loadThumb(entry.target);
  }
}, { rootMargin: "800px 0px" }) : null;
function loadThumb(img) {
  thumb(Number(img.dataset.n)).then((t) => { img.src = t.url; }).catch(() => { if (io) setTimeout(() => io.observe(img), 3000); });
}

function paintTile(n) {
  const t = tiles.get(n);
  if (!t) return;
  const on = SEL.has(n);
  const img = MAN.images[n - 1];
  t.li.dataset.on = String(on);
  t.tick.hidden = !on;
  t.btn.setAttribute("aria-pressed", String(on));
  t.btn.setAttribute("aria-label", on ? `Image ${pad2(img.k)}, ${secOf(img).name}, approved. Tap to undo.` : `Approve image ${pad2(img.k)}, ${secOf(img).name}`);
  t.btn.innerHTML = on ? CHECK + "Approved" : "Approve";
}
function paintSection(si) {
  const ui = secUI[si];
  if (!ui) return;
  const sec = MAN.sections[si];
  const count = sec.items.filter((i) => SEL.has(i.n)).length;
  const all = count === sec.items.length;
  ui.count.textContent = `${count} of ${sec.items.length} approved`;
  ui.all.textContent = all ? "Clear all" : "Approve all";
  ui.all.setAttribute("aria-label", all ? `Clear all approvals in ${sec.name}` : `Approve all ${sec.items.length} images in ${sec.name}`);
}
function paintBar() {
  const count = approved().length;
  barCount.textContent = String(count);
  barHint.textContent = sending ? "Sending to Omar. This can take up to a minute." : count ? "Press Submit when you are finished" : "Approve at least one image";
  barSubmit.disabled = !count || sending;
  barSubmit.textContent = sending ? "Sending" : "Submit";
}
function afterChange() {
  saveSel(); paintBar();
  barError.hidden = true;
  if (viewerState) paintViewer();
}
function toggle(n) {
  if (sending) return;
  if (SEL.has(n)) SEL.delete(n); else SEL.add(n);
  paintTile(n); paintSection(MAN.images[n - 1].s);
  afterChange();
}
function toggleSection(si) {
  if (sending) return;
  const items = MAN.sections[si].items;
  const all = items.every((i) => SEL.has(i.n));
  for (const i of items) { if (all) SEL.delete(i.n); else SEL.add(i.n); paintTile(i.n); }
  paintSection(si);
  afterChange();
}

function sectionHead(sec, side) {

    h("div", { class: "sec-side" }, ...side));
}

function showSelection() {
  tiles = new Map(); secUI = [];
  const sections = MAN.sections.map((sec, si) => {
    const count = h("span", { class: "sec-count" });
    const all = h("button", { type: "button", class: "all", onclick: () => toggleSection(si) });

      const tick = h("span", { class: "tick", html: CHECK, hidden: true });
      const btn = h("button", { type: "button", class: "approve", id: "approve-" + img.n, onclick: () => toggle(img.n) });
      const marks = h("span", { class: "marks", hidden: true });

        pic, h("span", { class: "num" }, pad2(img.k)), tick, marks);

  barCount = h("strong", {});
  barHint = h("small", {});

  barError = h("p", { class: "error", role: "alert", hidden: true });
  const bar = h("div", { class: "bar" },
    h("div", { class: "bar-in" },
      h("p", { class: "count", "aria-live": "polite" }, barCount, ` of ${CFG.total} approved`, barHint),

    barError);

  app.replaceChildren(
    h("main", { class: "wrap" },
      h("header", { class: "head glass" },
        h("div", { class: "head-main" },
          logo(),
          h("h1", { class: "title" }, USE.title),
          h("p", { class: "lede" }, `The project images, grouped by project. Approve the ones to use ${USE.on}. Tap Approve under each image you want, or Approve all to take a whole section. Tap an image to see it larger. When you are finished, press Submit at the bottom.`),
          (legendEl = h("p", { class: "legend", hidden: true }))),
        h("div", { class: "head-side" },
          h("span", { class: "chip" }, `${CFG.total} images · ${MAN.sections.length} sections`),

      ...sections),
    bar);
  MAN.images.forEach((img) => paintTile(img.n));

/* ---------- viewer ---------- */
function openViewer(index, opener) {
  const img = h("img", { alt: "" });
  const counter = h("span", { class: "vchip" });
  const vmarks = h("span", { class: "vmarks" });
  const project = h("p", { class: "vproject" });
  const prev = h("button", { type: "button", class: "vbtn", "aria-label": "Previous image", html: LEFT, onclick: () => moveViewer(-1) });
  const next = h("button", { type: "button", class: "vbtn", "aria-label": "Next image", html: RIGHT, onclick: () => moveViewer(1) });
  const approveBtn = h("button", { type: "button", class: "vbtn vapprove", id: "viewer-approve", onclick: () => toggle(MAN.images[viewerState.index].n) });
  const close = h("button", { type: "button", class: "vbtn vclose", id: "viewer-close", onclick: closeViewer }, "Close");
  let touchX = null;
  const stage = h("div", { class: "viewer-stage",
    ontouchstart: (e) => { touchX = e.touches[0] ? e.touches[0].clientX : null; },
    ontouchend: (e) => {
      if (touchX === null) return;
      const dx = (e.changedTouches[0] ? e.changedTouches[0].clientX : touchX) - touchX;
      touchX = null;
      if (Math.abs(dx) > 48) moveViewer(dx < 0 ? 1 : -1);
    } }, img);
  const el = h("div", { class: "viewer", role: "dialog", "aria-modal": "true" },
    h("div", { class: "viewer-top" }, h("div", { class: "vleft" }, counter, vmarks), close),
    stage, project,
    h("div", { class: "viewer-ctl" }, prev, approveBtn, next));
  viewerState = { index, el, img, counter, vmarks, project, prev, next, approveBtn, opener, overflow: document.body.style.overflow };
  document.body.style.overflow = "hidden";
  document.body.append(el);
  paintViewer(true);
  close.focus({ preventScroll: true });
}
function paintViewer(imageChanged) {
  const v = viewerState;
  const item = MAN.images[v.index];
  const sec = secOf(item);
  const on = SEL.has(item.n);
  v.counter.textContent = `${pad2(item.k)} / ${pad2(sec.items.length)}`;
  v.vmarks.replaceChildren(...markEls(item.n));
  v.project.textContent = `${eyebrow(sec)} · ${sec.name}`;
  v.el.setAttribute("aria-label", `Image ${pad2(item.k)}, ${sec.name}`);
  v.prev.disabled = v.index === 0;
  v.next.disabled = v.index === MAN.images.length - 1;
  v.approveBtn.setAttribute("aria-pressed", String(on));
  v.approveBtn.innerHTML = on ? CHECK + "Approved" : "Approve";
  if (!imageChanged) return;
  const shown = v.index;
  v.img.alt = `Image ${pad2(item.k)}, ${sec.name}`;
  delete v.img.dataset.full;
  v.img.removeAttribute("src");
  thumb(item.n).then((t) => { if (viewerState && viewerState.index === shown && !v.img.dataset.full) v.img.src = t.url; }).catch(() => {});
  full(item.n).then((url) => { if (viewerState && viewerState.index === shown) { v.img.src = url; v.img.dataset.full = "1"; } }).catch(() => {});
}
function moveViewer(step) {
  const next = viewerState.index + step;
  if (next < 0 || next >= MAN.images.length) return;
  viewerState.index = next;
  paintViewer(true);
}
function closeViewer() {
  if (!viewerState) return;
  const { el, overflow, opener, index } = viewerState;
  document.body.style.overflow = overflow;
  el.remove();
  viewerState = null;
  const t = tiles.get(MAN.images[index].n);
  const target = t && t.li.isConnected ? t.li.querySelector(".pic") : opener;
  if (target && target.isConnected) {
    target.focus({ preventScroll: true });
    target.scrollIntoView({ block: "nearest" });
  }
}
window.addEventListener("keydown", (e) => {
  if (!viewerState) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowRight") moveViewer(1);
  if (e.key === "ArrowLeft") moveViewer(-1);
});

/* ---------- numbers ---------- */
function groups(picked) {
  return MAN.sections.map((sec) => ({ sec, items: picked.filter((i) => i.s === sec.index) }));
}
function numberLines(picked) {
  return groups(picked).filter((g) => g.items.length)
    .map((g) => ({ title: `${g.sec.id} ${g.sec.name}`, nums: g.items.map((i) => pad2(i.k)).join(", ") }));
}
const asciiLabel = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s*·\s*/g, " - ").replace(/[^\x20-\x7e]/g, "");
function encodeSel(picked) {
  const bytes = new Uint8Array(Math.ceil(CFG.total / 8));
  for (const i of picked) { const b = i.n - 1; bytes[b >> 3] |= 1 << (b & 7); }
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeSel(code) {
  let s = code.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s), out = [];
  for (let b = 0; b < bin.length * 8 && b < CFG.total; b += 1) if (bin.charCodeAt(b >> 3) & (1 << (b & 7))) out.push(b + 1);
  return out;
}

/* ---------- contact sheet PDF: A4 portrait, 4 x 4 glass tiles, one project per page run ---------- */
const SHEET = { W: 794, H: 1123, X: 40, HEAD_Y: 36, HEAD_H: 128, GRID_Y: 178, COLS: 4, ROWS: 4, GAP: 12, TILE_W: 169.5, TILE_H: 218.2 };
function loadImage(src) {
  return new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = () => reject(new Error("image")); im.src = src; });
}
function rrSub(ctx, x, y, w, hh, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + hh, r);
  ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rr(ctx, x, y, w, hh, r) { ctx.beginPath(); rrSub(ctx, x, y, w, hh, r); }
function glassPanel(ctx, scale, x, y, w, hh, r, blur, offY, alpha) {
  ctx.save();
  ctx.beginPath(); ctx.rect(-100, -100, SHEET.W + 200, SHEET.H + 200); rrSub(ctx, x, y, w, hh, r); ctx.clip("evenodd");
  ctx.shadowColor = `rgba(43,37,35,${alpha})`; ctx.shadowBlur = blur * scale; ctx.shadowOffsetY = offY * scale;
  ctx.fillStyle = "#000"; rr(ctx, x, y, w, hh, r); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.42)"; rr(ctx, x, y, w, hh, r); ctx.fill();
  ctx.save(); rr(ctx, x, y, w, hh, r); ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.fillRect(x, y + 1, w, 1);
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1; rr(ctx, x + 0.5, y + 0.5, w - 1, hh - 1, r - 0.5); ctx.stroke();
}
function tracked(ctx, text, x, y, spacing, alignRight) {
  const widths = [...text].map((ch) => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * Math.max(0, widths.length - 1);
  let cx = alignRight ? x - total : x;
  [...text].forEach((ch, i) => { ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
  return total;
}
function trackedWidth(ctx, text, spacing) {
  return [...text].reduce((a, ch) => a + ctx.measureText(ch).width, 0) + spacing * Math.max(0, [...text].length - 1);
}
function fit(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function wrapLines(ctx, text, maxW, maxLines) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (!line || ctx.measureText(t).width <= maxW) line = t;
    else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    const keep = lines.slice(0, maxLines);
    keep[maxLines - 1] = fit(ctx, keep[maxLines - 1] + " " + lines.slice(maxLines).join(" "), maxW);
    if (!keep[maxLines - 1].endsWith("…")) keep[maxLines - 1] += "…";
    return keep;
  }
  return lines.map((l) => fit(ctx, l, maxW));
}
function drawPage(ctx, scale, page, pageNo, pageCount, assets, pics, totals) {
  const S = SHEET;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = "#e6ded3"; ctx.fillRect(0, 0, S.W, S.H);
  const bg = assets.bg;
  const k = Math.max(S.W / bg.naturalWidth, S.H / bg.naturalHeight);
  ctx.drawImage(bg, (S.W - bg.naturalWidth * k) / 2, (S.H - bg.naturalHeight * k) / 2, bg.naturalWidth * k, bg.naturalHeight * k);

  // header panel
  const hx = S.X, hy = S.HEAD_Y, hw = S.W - 2 * S.X, hh = S.HEAD_H;
  glassPanel(ctx, scale, hx, hy, hw, hh, 22, 30, 10, 0.10);
  const ix = hx + 25, iy = hy + 21;
  const lh = 22, lw = lh * (assets.logo.naturalWidth / assets.logo.naturalHeight);
  ctx.drawImage(assets.logo, ix, iy, lw, lh);
  ctx.textBaseline = "alphabetic";
  // page chip (right, aligned with the last text line)
  ctx.font = `10px ${FONT}`;
  const chipText = `PAGE ${pageNo} OF ${pageCount}`;
  const chipW = trackedWidth(ctx, chipText, 1.6) + 26, chipH = 26.5;
  const chipX = hx + hw - 25 - chipW, chipY = hy + hh - 21 - chipH;
  ctx.fillStyle = "rgba(255,255,255,0.55)"; rr(ctx, chipX, chipY, chipW, chipH, chipH / 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1; rr(ctx, chipX + 0.5, chipY + 0.5, chipW - 1, chipH - 1, chipH / 2 - 0.5); ctx.stroke();
  ctx.fillStyle = "#49413e"; tracked(ctx, chipText, chipX + 13, chipY + 17, 1.6, false);
  // title: the project name
  const maxTitle = chipX - 24 - ix;
  let size = 24;
  ctx.font = `${size}px ${FONT}`;
  while (size > 17 && ctx.measureText(page.sec.name).width > maxTitle) { size -= 1; ctx.font = `${size}px ${FONT}`; }
  ctx.fillStyle = "#2b2523"; ctx.fillText(fit(ctx, page.sec.name, maxTitle), ix, iy + lh + 14 + 19.6);
  ctx.font = `12px ${FONT}`; ctx.fillStyle = "#6a6461";
  const part = page.parts > 1 ? ` · part ${page.part} of ${page.parts}` : "";
  ctx.fillText(fit(ctx, `${USE.label} · ${eyebrow(page.sec)}${part} · ${page.count} of ${page.sec.items.length} approved · ${totals.date}`, maxTitle), ix, iy + lh + 14 + 26.4 + 6 + 12.3);

  // tiles
  page.items.forEach((img, i) => {
    const x = S.X + (i % S.COLS) * (S.TILE_W + S.GAP);
    const y = S.GRID_Y + Math.floor(i / S.COLS) * (S.TILE_H + S.GAP);
    glassPanel(ctx, scale, x, y, S.TILE_W, S.TILE_H, 16, 22, 8, 0.09);
    const wx = x + 9, wy = y + 9, ww = S.TILE_W - 18;
    ctx.fillStyle = "rgba(255,255,255,0.3)"; rr(ctx, wx, wy, ww, ww, 10); ctx.fill();
    const pic = pics.get(img.n);
    if (pic) {
      const f = Math.min(ww / pic.naturalWidth, ww / pic.naturalHeight);
      const dw = pic.naturalWidth * f, dh = pic.naturalHeight * f;
      ctx.save(); rr(ctx, wx, wy, ww, ww, 10); ctx.clip();
      ctx.drawImage(pic, wx + (ww - dw) / 2, wy + (ww - dh) / 2, dw, dh);
      ctx.restore();
    }
    const tx = x + 13, tw = ww - 8, capY = wy + ww + 7;
    ctx.font = `13px ${FONT}`; ctx.fillStyle = "#2b2523";
    ctx.fillText(pad2(img.k), tx, capY + 11.7);
    ctx.font = `8.5px ${FONT}`; ctx.fillStyle = "#6a6461";
    wrapLines(ctx, img.name, tw, 2).forEach((line, li) => ctx.fillText(line, tx, capY + 15.6 + 2 + 8.1 + li * 11.05));
  });
}
function canvasJpeg(canvas, quality) {
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? b.arrayBuffer().then((ab) => resolve(new Uint8Array(ab)), reject) : reject(new Error("encode"))), "image/jpeg", quality));
}
function pdfFromJpegs(jpegs, pxW, pxH) {
  const PW = 595.28, PH = 841.89;
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let size = 0;
  const push = (d) => { const bytes = typeof d === "string" ? enc.encode(d) : d; parts.push(bytes); size += bytes.length; };
  const object = (id, dict, stream) => {
    offsets[id] = size;
    push(`${id} 0 obj\n${dict}\n`);
    if (stream) { push("stream\n"); push(stream); push("\nendstream\n"); }
    push("endobj\n");
  };
  const n = jpegs.length;
  const imgId = (p) => 3 + p * 3, contentId = (p) => 4 + p * 3, pageId = (p) => 5 + p * 3;
  push("%PDF-1.4\n");
  push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
  object(1, "<< /Type /Catalog /Pages 2 0 R >>");
  object(2, `<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_, p) => `${pageId(p)} 0 R`).join(" ")}] >>`);
  jpegs.forEach((jpeg, p) => {
    object(imgId(p), `<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>`, jpeg);
    const stream = enc.encode(`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q\n`);
    object(contentId(p), `<< /Length ${stream.length} >>`, stream);
    object(pageId(p), `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Contents ${contentId(p)} 0 R /Resources << /XObject << /Im0 ${imgId(p)} 0 R >> >> >>`);
  });
  const count = 2 + n * 3;
  const xref = size;
  let table = `xref\n0 ${count + 1}\n0000000000 65535 f \n`;
  for (let id = 1; id <= count; id += 1) table += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
  push(table);
  push(`trailer\n<< /Size ${count + 1} /Root 1 0 R /Info << /Title (Adada & Kabbani approved project images) >> >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}
async function makeSheet(picked, opts) {
  const scale = (opts && opts.scale) || 1.6, quality = (opts && opts.quality) || 0.84;
  const pages = [];
  for (const g of groups(picked)) {
    if (!g.items.length) continue;
    const parts = Math.ceil(g.items.length / 16);
    for (let p = 0; p < parts; p += 1) pages.push({ sec: g.sec, items: g.items.slice(p * 16, p * 16 + 16), part: p + 1, parts, count: g.items.length });
  }
  const [bg, logoPng] = await Promise.all([loadImage("bg-port.jpg"), loadImage("logo.png")]);
  const assets = { bg, logo: logoPng };
  const totals = { count: picked.length, date: today() };
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(SHEET.W * scale); canvas.height = Math.round(SHEET.H * scale);
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  const jpegs = [];
  for (let p = 0; p < pages.length; p += 1) {
    const pics = new Map();
    await Promise.all(pages[p].items.map(async (img) => {
      try { const t = await thumb(img.n); pics.set(img.n, await loadImage(t.url)); } catch { /* tile drawn without its picture */ }
    }));
    drawPage(ctx, scale, pages[p], p + 1, pages.length, assets, pics, totals);
    jpegs.push(await canvasJpeg(canvas, quality));
  }
  return pdfFromJpegs(jpegs, canvas.width, canvas.height);
}
async function makeSheetForEmail(picked) {
  let pdf = await makeSheet(picked);
  if (pdf.size > 9.2e6) pdf = await makeSheet(picked, { scale: 1.25, quality: 0.78 });
  return pdf.size > 9.2e6 ? null : pdf;
}

/* ---------- submit ---------- */
const subjectLine = (picked) => `Adada & Kabbani · ${USE.label} images: ${picked.length} of ${CFG.total} approved by ${USER}`;
async function sendEmail(picked, pdf) {
  const base = location.origin + location.pathname;
  const fields = {
    _subject: subjectLine(picked),
    _template: "table",
    _captcha: "false",
    "Approved for": USE.label,
    "Approved by": USER,
    "Approved": `${picked.length} of ${CFG.total}`,
  };
  for (const g of groups(picked)) {
    fields[asciiLabel(`${g.sec.id} ${g.sec.name}`)] = g.items.length
      ? `${g.items.map((i) => pad2(i.k)).join(", ")} (${g.items.length} of ${g.sec.items.length})`
      : `None (0 of ${g.sec.items.length})`;
  }
  fields["Contact sheet"] = `${base}#r-${encodeSel(picked)}`;
  fields["Submitted"] = new Date().toLocaleString("en-GB", { timeZone: "Asia/Riyadh" }) + " (Riyadh time)";
  const read = async (response) => {
    const data = await response.json().catch(() => null);
    return { ok: response.ok && !!data && String(data.success) === "true", message: String((data && data.message) || response.status) };
  };
  // The relay sometimes stops answering; never wait on it for ever.
  const post = async (body, headers, ms) => {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    try { return await read(await fetch(MAN.mail, { method: "POST", headers, body, signal: ctl.signal })); }
    catch (e) { return { ok: false, message: e && e.name === "AbortError" ? "timeout" : String((e && e.message) || e) }; }
    finally { clearTimeout(timer); }
  };
  let first = null;
  if (pdf) {
    const form = new FormData();
    for (const [k, v] of Object.entries(fields)) form.append(k, v);
    form.append("attachment", new File([pdf], PDF_NAME, { type: "application/pdf" }));
    first = await post(form, { Accept: "application/json" }, SEND_MS + Math.round((pdf.size / 1e6) * 10000));
    if (first.ok) return { ok: true, how: "attachment" };
  }
  const second = await post(JSON.stringify(fields), { "Content-Type": "application/json", Accept: "application/json" }, first && first.message === "timeout" ? 8000 : LINKS_MS);
  return { ok: second.ok, how: "links", message: second.message, first: first && first.message };
}

async function submit() {
  const picked = approved();
  if (!picked.length || sending) return;
  sending = true; paintBar();
  barError.hidden = true;
  let result;
  try {
    let pdf = null;
    try { pdf = await makeSheetForEmail(picked); } catch { pdf = null; }
    result = await sendEmail(picked, pdf);
  } catch (e) {
    result = { ok: false, message: String((e && e.message) || e) };
  }
  window.__lastSend = result;
  sending = false;
  closeViewer();
  if (result.ok) { failures = 0; rememberSent(picked); showDone(picked.length); return; }
  failures += 1;
  showNotSent(picked, result);
}

/* sending failed: try again, or hand the selection to the mail app */
function selectionText(picked) {
  return [`Approved ${USE.for}: ${picked.length} of ${CFG.total} images`, `Approved by: ${USER}`, "",
    ...numberLines(picked).map((l) => `${l.title}: ${l.nums}`), "",
    `Contact sheet: ${location.origin + location.pathname}#r-${encodeSel(picked)}`].join("\n");
}
function mailAddress() {
  try { const a = decodeURIComponent(String(MAN.mail).split("/").pop()); return /^[^@\s/]+@[^@\s/]+\.[^@\s/]+$/.test(a) ? a : null; } catch { return null; }
}
function showNotSent(picked, result) {
  const text = selectionText(picked);
  const to = mailAddress();
  const subject = subjectLine(picked);
  const mail = to ? h("a", { class: "ghost", id: "mail-selection", onclick: () => rememberSent(picked),
    href: `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text.replace(/\n/g, "\r\n"))}` }, "Email the selection") : null;
  const detail = result && result.message && !/^(timeout|Failed to fetch|Load failed|NetworkError.*)$/i.test(result.message) && result.message.length < 240 ? result.message : null;
  app.replaceChildren(card(
    h("h1", { class: "title" }, "Not sent yet"),
    h("p", { class: "lede" }, to
      ? "The email service did not respond. Press Try again, or send your selection to Omar from your mail app."
      : "The email service did not respond. Press Try again in a minute."),
    h("p", { class: "numbers sheet-text" }, text),
    h("div", { class: "stack" },
      h("button", { class: "primary", type: "button", id: "retry", onclick: () => { showSelection(); submit(); } }, "Try again"),
      mail,
      h("button", { class: "ghost", type: "button", onclick: showSelection }, "Back to the images")),
    to ? h("p", { class: "note small" }, "If you use Email the selection, you are done once your mail app has sent it.") : null,
    detail ? h("p", { class: "note small" }, "Service reply: " + detail) : null));
  window.scrollTo(0, 0);
}

function showDone(count) {
  app.replaceChildren(card(
    h("div", { class: "done-mark", html: CHECK.replace(/width="16" height="16"/, 'width="30" height="30"').replace('stroke-width="2.8"', 'stroke-width="2.4"') }),
    h("h1", { class: "title" }, "Sent. Thank you."),
    h("p", { class: "lede" }, `${count} of ${CFG.total} images approved ${USE.for} and sent to Omar.`),
    h("button", { class: "ghost", type: "button", onclick: showSelection }, "Change the selection"),
    h("div", { class: "next-forms" }, h("p", { class: "label" }, "Also to approve"),
      ...Object.keys(USES).filter((u) => u !== CFG.use).map((u) => h("a", { href: USES[u].path, id: "next-" + u }, USES[u].title)))));
  window.scrollTo(0, 0);
}

/* ---------- approved images (link in the email) ---------- */
function showResult(numbers) {
  const wanted = new Set(numbers);
  const picked = MAN.images.filter((i) => wanted.has(i.n));
  const lines = numberLines(picked);
  const error = h("p", { class: "error", role: "alert", hidden: true });
  const download = h("button", { class: "primary", id: "download", type: "button", onclick: async () => {
    if (download.disabled) return;
    download.disabled = true; download.textContent = "Building"; error.hidden = true;
    try {
      const url = URL.createObjectURL(await makeSheet(picked));
      const link = h("a", { href: url, download: PDF_NAME });
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch {
      error.textContent = "The contact sheet could not be built. Check your connection and try again."; error.hidden = false;
    }
    download.disabled = false; download.textContent = "Download contact sheet PDF";
  } }, "Download contact sheet PDF");
  const copy = h("button", { class: "ghost", type: "button", onclick: () => {
    navigator.clipboard.writeText(lines.map((l) => `${l.title}: ${l.nums}`).join("\n")).then(() => { copy.textContent = "Copied"; }).catch(() => {});
  } }, "Copy the numbers");
  const sections = groups(picked).filter((g) => g.items.length).map((g) => {
    const grid = h("ul", { class: "grid" });
    for (const img of g.items) {
      const pic = h("img", { alt: `Image ${pad2(img.k)}, ${g.sec.name}`, width: img.tw, height: img.th, "data-n": img.n });
      grid.append(h("li", { class: "tile glass" }, h("div", { class: "pic" }, pic),
        h("div", { class: "cap" }, h("b", {}, pad2(img.k)), h("span", {}, img.name))));
      if (io) io.observe(pic); else loadThumb(pic);
    }
    return h("section", { class: "section", "aria-labelledby": "h" + g.sec.id },
      sectionHead(g.sec, [h("span", { class: "sec-count" }, `${g.items.length} of ${g.sec.items.length} approved`)]), grid);
  });
  app.replaceChildren(h("main", { class: "wrap", style: "padding-bottom:64px" },
    h("header", { class: "head res-head glass" },
      h("div", { class: "head-main" },
        logo(),
        h("h1", { class: "title" }, "Approved images"),
        h("p", { class: "lede" }, `${picked.length} of ${CFG.total} approved ${USE.for}.`),
        lines.length ? h("div", { class: "numbers" }, ...lines.map((l) => h("p", {}, h("b", {}, l.title + ": "), l.nums))) : null,
        error),
      h("div", { class: "actions" }, download, copy)),
    ...sections));
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
window.addEventListener("storage", (e) => {
  if (e.key && e.key.startsWith("ak-sent:" + NS + ":") && KEY && tiles.size) { loadOthers(); refreshMarks(); }
});
window.addEventListener("pageshow", (e) => { if (e.persisted && KEY && tiles.size) refreshFromRemote(); });
function start() {
  adoptLegacy();
  loadOthers();
  const m = location.hash.match(/^#r-([A-Za-z0-9_-]+)$/);
  if (m) {
    let nums = [];
    try { nums = decodeSel(m[1]); } catch { nums = []; }
    showResult(nums);
    return;
  }
  try {
    const saved = JSON.parse(store.get(selKey()) || "[]");
    const valid = new Set(MAN.images.map((i) => i.n));
    SEL = new Set(Array.isArray(saved) ? saved.filter((n) => valid.has(n)) : []);
  } catch { SEL = new Set(); }
  showSelection();
  refreshFromRemote();
}
window.addEventListener("hashchange", () => { if (KEY) { closeViewer(); start(); } });
(async () => {
  if (!window.crypto || !crypto.subtle) {
    app.replaceChildren(card(h("h1", { class: "title" }, USE.title), h("p", { class: "lede" }, "This browser cannot open the page. Please open the link in Safari or Chrome.")));
    return;
  }
  store.remove("ak-pass:" + NS);   // the old passcode-only sign-in
  let remembered = null;
  try { remembered = JSON.parse(store.get(LOGIN_KEY) || "null"); } catch { remembered = null; }
  if (remembered && remembered.u && remembered.p) {
    app.replaceChildren(card(h("p", { class: "note", style: "margin-top:24px" }, "Loading")));
    try { await unlock(remembered.u, remembered.p); start(); return; } catch (err) { if (err.message === "wrong") store.remove(LOGIN_KEY); }
  }
  showGate();
})();
