<style>
/* One visual world: a quiet reading room for a landscape A4 profile. Pages sit centred on warm charcoal; oxblood marks the one action. */
:root{
  --bg:#1C1A19; --bar:#141312; --ink:#F4F1EA; --muted:#AEA79D; --line:rgba(244,241,234,.12); --accent:#922133; --accent-hi:#A8283D;
  --font:Optima,"Optima Nova",Candara,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px max(16px,calc((100% - 1200px)/2));background:var(--bar);border-bottom:1px solid var(--line)}
.logo{display:block;height:44px;width:auto}
.tools{display:flex;align-items:center;gap:14px}
#count{font-size:12px;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--accent);
  border:0;border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent-hi)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 16px 48px}
.page{width:min(1200px,100%,calc((100vh - 100px) * 1.4144));background:#EDE9E1;border-radius:4px;
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);overflow:hidden}
.page img{display:block;width:100%;height:auto;aspect-ratio:3369/2382}
@media (max-width:560px){.logo{height:36px}#count{display:none}main{gap:10px;padding-top:12px}}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.svg" alt="Adada &amp; Kabbani" width="112" height="44">
  <div class="tools"><span id="count" aria-live="polite">1 / 144</span>
    <a class="btn" href="../adada-kabbani-2026-company-profile.pdf" download="Adada-Kabbani-Company-Profile-2026.pdf">Download PDF</a></div>
</header>
<main id="pages"></main>
<noscript><p style="text-align:center"><a href="../adada-kabbani-2026-company-profile.pdf" style="color:#F4F1EA">Open the company profile (PDF)</a></p></noscript>
<script>
(function(){
  var TOTAL = 144, main = document.getElementById("pages"), count = document.getElementById("count");
  var frag = document.createDocumentFragment();
  for(var i = 1; i <= TOTAL; i++){
    var n = ("00" + i).slice(-3);
    var sec = document.createElement("section"); sec.className = "page"; sec.id = "p" + i; sec.dataset.n = i;
    var img = document.createElement("img");
    img.width = 3369; img.height = 2382; img.alt = "Page " + i + " of " + TOTAL;
    img.decoding = "async"; if(i > 2) img.loading = "lazy";
    img.sizes = "(max-width: 1232px) calc(100vw - 32px), 1200px";
    img.srcset = "pages/m/p" + n + ".jpg 1685w, pages/p" + n + ".jpg 3369w";
    img.src = "pages/p" + n + ".jpg";
    img.onerror = function(){ var el = this; if(el.dataset.retry) return; el.dataset.retry = "1";
      setTimeout(function(){ el.srcset = el.srcset.replace(/\.jpg/g, ".jpg?r=1"); el.src = el.src + "?r=1"; }, 1500); };
    sec.appendChild(img); frag.appendChild(sec);
  }
  main.appendChild(frag);
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting) count.textContent = e.target.dataset.n + " / " + TOTAL; });
    }, {rootMargin: "-45% 0px -45% 0px"});
    main.querySelectorAll(".page").forEach(function(s){ io.observe(s); });
  }
  var m = /^#p(\d+)$/.exec(location.hash);
  if(m){ var t = document.getElementById("p" + m[1]); if(t){ t.querySelector("img").loading = "eager"; t.scrollIntoView(); } }
})();
</script>
</body>
</html>
